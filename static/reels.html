<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reels Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    body { background: radial-gradient(1200px 600px at 50% -10%, #3b1d8f55, transparent), #0b0b14; }
    .glass { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(12px); }
    .field { margin-top:.25rem; width:100%; border-radius:.75rem; background:rgba(0,0,0,.4); padding:.75rem 1rem; color:#fff; outline:none; box-shadow:0 0 0 1px rgba(255,255,255,.1); }
    .field:focus { box-shadow:0 0 0 2px #8b5cf6; }
    .chip { border-radius:.75rem; padding:.6rem .9rem; font-size:.875rem; background:rgba(0,0,0,.4); box-shadow:0 0 0 1px rgba(255,255,255,.1); cursor:pointer; }
    .chip.on { background:#7c3aed; color:#fff; box-shadow:none; }
    .lbl { display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:#64748b; }
  </style>
</head>
<body class="min-h-screen text-slate-200 antialiased">
  <nav class="mx-auto max-w-3xl px-4 pt-6 flex flex-wrap justify-center gap-2 text-sm">
    <a href="/" class="rounded-full px-4 py-1.5 text-slate-400 hover:text-white hover:bg-white/5">Single video</a>
    <a href="/playlist.html" class="rounded-full px-4 py-1.5 text-slate-400 hover:text-white hover:bg-white/5">Profile / Playlist</a>
    <a href="/discover.html" class="rounded-full px-4 py-1.5 text-slate-400 hover:text-white hover:bg-white/5">Discover</a>
    <a href="/reels.html" class="rounded-full bg-white/10 px-4 py-1.5 text-white">Reels Maker</a>
    <a href="/ssflix.html" class="rounded-full px-4 py-1.5 text-slate-400 hover:text-white hover:bg-white/5">SSFlix</a>
  </nav>
  <main class="mx-auto max-w-3xl px-4 py-12">
    <header class="text-center mb-10">
      <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 shadow-lg shadow-violet-900/50">
        <svg class="h-7 w-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243 4.243 3 3 0 004.243-4.243zm0-5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z"/></svg>
      </div>
      <h1 class="mt-4 text-4xl font-extrabold tracking-tight text-white">Reels Maker</h1>
      <p class="mt-2 text-slate-400">Turn one long video into 10–15 short reels (1–5 min each).</p>
    </header>

    <form id="form" class="glass rounded-2xl p-5 space-y-5">
      <div>
        <div class="flex gap-2 mb-2">
          <button type="button" data-src="url" class="chip on src">Video link</button>
          <button type="button" data-src="file" class="chip src">Already downloaded</button>
        </div>
        <input id="url" type="text" placeholder="https://… paste a long video URL" class="field" />
        <select id="file" class="field hidden"></select>
      </div>

      <div>
        <label class="lbl">Folder name <span class="normal-case tracking-normal">(optional — default is the video title)</span></label>
        <input id="folder" type="text" placeholder="abc" class="field" />
        <p class="mt-1 text-xs text-slate-500">Reels are saved to <span class="text-slate-300">download/<span id="folderPrev">&lt;video name&gt;</span>/reels/</span></p>
      </div>

      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label class="lbl">Reel length</label>
          <div class="mt-1 flex flex-wrap gap-2" id="lenChips">
            <button type="button" class="chip" data-v="60">1 min</button>
            <button type="button" class="chip" data-v="120">2 min</button>
            <button type="button" class="chip on" data-v="180">3 min</button>
            <button type="button" class="chip" data-v="300">5 min</button>
          </div>
        </div>
        <div>
          <label class="lbl">How many reels</label>
          <div class="mt-1 flex flex-wrap gap-2 items-center" id="countChips">
            <button type="button" class="chip on" data-v="10">10</button>
            <button type="button" class="chip" data-v="15">15</button>
            <input id="countCustom" type="number" min="1" max="30" placeholder="custom" class="chip w-24 text-white outline-none" />
          </div>
        </div>
      </div>

      <div class="grid sm:grid-cols-3 gap-5">
        <div>
          <label class="lbl">Format</label>
          <select id="format" class="field">
            <option value="vertical_blur">Vertical 9:16 (blur fill)</option>
            <option value="vertical_crop">Vertical 9:16 (crop center)</option>
            <option value="original">Original shape</option>
          </select>
        </div>
        <div>
          <label class="lbl">Pick clips</label>
          <select id="layout" class="field">
            <option value="spread">Spread across whole video</option>
            <option value="sequential">Back-to-back from start</option>
          </select>
        </div>
        <div>
          <label class="lbl">Download quality</label>
          <select id="quality" class="field">
            <option value="1080">1080p</option><option value="720">720p</option><option value="best">Best</option>
          </select>
        </div>
      </div>

      <p id="plan" class="text-xs text-slate-500"></p>

      <button id="goBtn" class="w-full rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 px-6 py-3 font-semibold text-white hover:opacity-90 disabled:opacity-50 transition">
        Make reels
      </button>

      <div id="progress" class="hidden">
        <div class="h-2 w-full overflow-hidden rounded-full bg-white/10">
          <div id="bar" class="h-full w-0 bg-gradient-to-r from-violet-500 to-emerald-400 transition-all"></div>
        </div>
        <p id="status" class="mt-2 text-sm text-slate-400"></p>
      </div>
    </form>

    <p id="error" class="hidden mt-4 rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-300"></p>

    <section class="mt-10">
      <h3 class="text-lg font-semibold text-white mb-3">Reel folders</h3>
      <div id="projects" class="space-y-3"></div>
    </section>
  </main>

<script>
const $ = id => document.getElementById(id);
let source = 'url', clipSeconds = 180, count = 10;

const fmtSize = b => b > 1e9 ? (b/1e9).toFixed(2)+' GB' : (b/1e6).toFixed(1)+' MB';
const fmtTime = s => { s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const showError = m => { $('error').textContent = m; $('error').classList.toggle('hidden', !m); };
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || 'Something went wrong.');
  return data;
}

function chips(containerId, onPick) {
  $(containerId).querySelectorAll('button.chip').forEach(b => b.onclick = () => {
    $(containerId).querySelectorAll('button.chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); onPick(+b.dataset.v); updatePlan();
  });
}
chips('lenChips', v => clipSeconds = v);
chips('countChips', v => { count = v; $('countCustom').value = ''; });
$('countCustom').oninput = e => {
  const v = +e.target.value; if (!v) return;
  $('countChips').querySelectorAll('button.chip').forEach(x => x.classList.remove('on'));
  count = Math.max(1, Math.min(30, v)); updatePlan();
};
document.querySelectorAll('.src').forEach(b => b.onclick = () => {
  document.querySelectorAll('.src').forEach(x => x.classList.remove('on')); b.classList.add('on');
  source = b.dataset.src;
  $('url').classList.toggle('hidden', source !== 'url');
  $('file').classList.toggle('hidden', source !== 'file');
  $('quality').disabled = source !== 'url';
});
$('folder').oninput = () => { $('folderPrev').textContent = $('folder').value.trim() || '<video name>'; };

function updatePlan() {
  $('plan').textContent = `${count} reels × ${clipSeconds/60} min = ${count*clipSeconds/60} min of footage. ` +
    `If the video is shorter than that, you get as many full reels as fit.`;
}
updatePlan();

async function loadFiles() {
  try {
    const d = await api('/api/downloads');
    $('file').innerHTML = d.files.length ? '' : '<option value="">No downloaded videos yet</option>';
    d.files.filter(f => !/\.mp3$/i.test(f.name)).forEach(f => $('file').add(new Option(`${f.name} (${fmtSize(f.size)})`, f.name)));
  } catch {}
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  showError('');
  const body = { clip_seconds: clipSeconds, count, layout: $('layout').value, format: $('format').value,
                 quality: $('quality').value, folder: $('folder').value.trim() || null };
  if (source === 'url') { if (!$('url').value.trim()) return showError('Paste a video link.'); body.url = $('url').value.trim(); }
  else { if (!$('file').value) return showError('Pick a downloaded video.'); body.file = $('file').value; }

  $('goBtn').disabled = true;
  $('progress').classList.remove('hidden'); $('bar').style.width = '0%'; $('status').textContent = 'Starting…';
  try {
    const { job_id } = await api('/api/reels/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    while (true) {
      await new Promise(r => setTimeout(r, 800));
      const j = await api('/api/reels/progress/' + job_id);
      $('bar').style.width = (j.percent || 0) + '%';
      if (j.status === 'error') throw new Error(j.error);
      if (j.status === 'done') {
        $('status').innerHTML = `✅ ${j.total} reels saved to <span class="text-white"></span>`;
        $('status').querySelector('span').textContent = j.path;
        loadProjects(); break;
      }
      const sp = j.status === 'downloading' && j.speed ? ` · ${(j.speed/1e6).toFixed(1)} MB/s` : '';
      const len = j.duration ? ` · source ${fmtTime(j.duration)}` : '';
      $('status').textContent = `${j.step || j.status} — ${j.percent || 0}%${sp}${len}`;
    }
  } catch (err) { showError(err.message); $('progress').classList.add('hidden'); }
  $('goBtn').disabled = false;
});

async function loadProjects() {
  const d = await api('/api/reels/projects');
  const box = $('projects'); box.innerHTML = '';
  if (!d.projects.length) { box.innerHTML = '<p class="glass rounded-xl px-4 py-3 text-sm text-slate-500">No reels yet.</p>'; return; }
  d.projects.forEach(p => {
    const f = encodeURIComponent(p.folder);
    const el = document.createElement('details');
    el.className = 'glass rounded-xl px-4 py-3';
    el.innerHTML = `<summary class="cursor-pointer flex items-center gap-3">
        <span class="flex-1 min-w-0 truncate text-white font-medium">${esc(p.folder)}</span>
        <span class="text-xs text-slate-500">${p.reels.length} reels</span>
        <button class="del rounded-lg bg-red-500/20 px-3 py-1 text-xs text-red-300 hover:bg-red-500/30">Delete folder</button>
      </summary>
      <p class="mt-2 text-xs text-slate-500 break-all">${esc(p.path)}</p>
      <ul class="mt-2 space-y-1">${p.reels.map(r => `<li class="flex items-center gap-3 text-sm">
        <span class="flex-1 truncate">${esc(r.name)}</span><span class="text-xs text-slate-500">${fmtSize(r.size)}</span>
        <a href="/api/reels/file/${f}/${encodeURIComponent(r.name)}" class="rounded-lg bg-white/10 px-3 py-1 text-xs hover:bg-white/20">Save</a></li>`).join('')}</ul>`;
    el.querySelector('.del').onclick = async ev => {
      ev.preventDefault();
      if (!confirm(`Delete "${p.folder}" and everything in it (source video + reels)?`)) return;
      await api('/api/reels/project/' + f, { method:'DELETE' }); loadProjects();
    };
    box.appendChild(el);
  });
}

loadFiles(); loadProjects();
</script>
</body>
</html>
